name: build-and-release

# Builds the plugin for x64, x86 (Win32) and ARM64 Notepad++, runs the Catch2
# test suite, and packages one Plugins-Admin-ready zip per architecture.
#
#   * push / PR         -> build + test + upload the zips as CI artifacts
#   * push a "v*" tag   -> additionally publish a GitHub Release with the zips
#                          and print the SHA-256 needed for each nppPluginList PR
#
# In each zip the DLL sits at the ROOT and is named exactly LLMAssistant.dll,
# which is what Notepad++ Plugins Admin requires.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin (x64 Release)
        run: >
          msbuild LLMAssistant.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m

      - name: Build plugin (Win32 Release)
        run: >
          msbuild LLMAssistant.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m

      # The runner's v143 tools (MSVC 14.44) cover x64 and x86 only, so ARM64
      # builds with the project's own toolset (v145).
      - name: Build plugin (ARM64 Release)
        run: >
          msbuild LLMAssistant.vcxproj
          /p:Configuration=Release
          /p:Platform=ARM64
          /p:WindowsTargetPlatformVersion=10.0
          /m

      - name: Configure tests (CMake)
        run: cmake -S . -B CMakeBuild

      - name: Build tests
        run: cmake --build CMakeBuild --config Debug

      - name: Run tests
        run: ctest --test-dir CMakeBuild --output-on-failure -C Debug

      # The 32-bit DLL compiles the same core code, so run the tests as 32-bit
      # too. (The x64 runner can't run ARM64 binaries.)
      - name: Configure tests (CMake, Win32)
        run: cmake -S . -B CMakeBuild-Win32 -A Win32

      - name: Build tests (Win32)
        run: cmake --build CMakeBuild-Win32 --config Debug

      - name: Run tests (Win32)
        run: ctest --test-dir CMakeBuild-Win32 --output-on-failure -C Debug

      - name: Package Plugins-Admin zips
        id: package
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "dev"
          }

          $notes = @(
            '### Notepad++ Plugins Admin metadata',
            '',
            'Each Notepad++ architecture has its own plugin list in nppPluginList. `id` is the SHA-256 of that architecture''s zip.'
          )
          foreach ($platform in "x64", "x86", "arm64") {
            # Checks the DLL's CPU type, version and Notepad++ exports, zips it
            # as LLMAssistant.dll at the zip root, prints the zip's SHA-256, and
            # returns the nppPluginList entry with that SHA-256 as "id".
            $entry = & .\packaging\make-release-zip.ps1 -Platform $platform -Version $ver -OutDir dist
            $notes += '', "Add / update this in ``src/pl.$platform.json``:", '', '```json', $entry, '```'
          }

          $notes | Set-Content dist\release-notes.md
          $notes | Add-Content $env:GITHUB_STEP_SUMMARY
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: LLMAssistant-x64
          path: dist/LLMAssistant_v${{ steps.package.outputs.version }}_x64.zip
          if-no-files-found: error

      - name: Upload CI artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: LLMAssistant-x86
          path: dist/LLMAssistant_v${{ steps.package.outputs.version }}_x86.zip
          if-no-files-found: error

      - name: Upload CI artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: LLMAssistant-arm64
          path: dist/LLMAssistant_v${{ steps.package.outputs.version }}_arm64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LLMAssistant_v${{ steps.package.outputs.version }}_x64.zip
            dist/LLMAssistant_v${{ steps.package.outputs.version }}_x86.zip
            dist/LLMAssistant_v${{ steps.package.outputs.version }}_arm64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: dist/release-notes.md
